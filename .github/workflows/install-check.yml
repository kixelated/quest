name: Check release installs

on:
  # The Release workflow calls this after publishing; dispatch it to recheck a tag.
  workflow_call:
    inputs:
      tag:
        description: Published release tag (for example v0.1.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.target }}, ${{ matrix.method }})
    strategy:
      fail-fast: false
      matrix:
        method: [mise, shell]
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        if: matrix.method == 'mise'
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.0
          install: false
          cache: false
          add_shims_to_path: false
          env: false
      - name: Install and check the published release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
          INSTALL_METHOD: ${{ matrix.method }}
          INSTALL_TARGET: ${{ matrix.target }}
        run: bash scripts/install-check.sh "$INSTALL_METHOD" "$INSTALL_TARGET"

  windows:
    name: install (${{ matrix.target }}, ${{ matrix.method }})
    strategy:
      fail-fast: false
      matrix:
        method: [mise, archive]
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nix doesn't run here; package.json's packageManager pins the flake's Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Set up mise
        if: matrix.method == 'mise'
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.0
          install: false
          cache: false
          add_shims_to_path: false
          env: false
      - name: Install and check the published Windows release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
          INSTALL_METHOD: ${{ matrix.method }}
          INSTALL_TARGET: ${{ matrix.target }}
        run: ./scripts/install-check.ps1 -Method $env:INSTALL_METHOD -Target $env:INSTALL_TARGET -Tag $env:RELEASE_TAG
