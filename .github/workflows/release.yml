name: Release

# A pushed version tag compiles, publishes, and then install-checks the release.
# Pull requests that could change the compiled binaries, and manual runs (even
# from a tag), only build and check them. Check runs the installer's own tests.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - package.json
      - package-lock.json
      - scripts/arch-check.sh
      - scripts/lifecycle-check.sh
      - flake.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Bun cross-compiles every target from one Linux runner, since the pinned
  # nixpkgs no longer evaluates on Intel macOS.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          determinate: false
      - name: Install npm dependencies
        run: nix develop --command just install
      # The dev shell's Bun is patched for Nix, so compile with the official
      # build of the same version.
      - name: Read the flake's Bun version
        id: bun
        run: echo "version=$(nix develop --command bun --version)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Compile
        run: |
          declare -A bun_targets=(
            [aarch64-apple-darwin]=bun-darwin-arm64
            [x86_64-apple-darwin]=bun-darwin-x64-baseline
            [aarch64-unknown-linux-gnu]=bun-linux-arm64
            [x86_64-unknown-linux-gnu]=bun-linux-x64-baseline
          )
          mkdir release
          for target in "${!bun_targets[@]}"; do
            bun run compile --target="${bun_targets[$target]}"
            tar -czf "release/quest-$target.tar.gz" -C dist quest
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error

  check:
    name: check (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Unpack
        env:
          TARGET: ${{ matrix.target }}
        run: tar -xzf "release/quest-$TARGET.tar.gz" -C "$RUNNER_TEMP"
      - name: Check the architecture
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/arch-check.sh "$RUNNER_TEMP/quest" "$TARGET"
      - name: Check the version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          actual=$("$RUNNER_TEMP/quest" --version)
          expected="quest $(jq -r .version package.json)"
          if [[ $actual != "$expected" ]]; then
            echo "::error::the binary reports $actual, not $expected"
            exit 1
          fi
          if [[ $REF_TYPE == tag && $actual != "quest ${TAG#v}" ]]; then
            echo "::error::$TAG builds $actual; bump package.json first"
            exit 1
          fi
      - name: Check the binary's lifecycle
        shell: bash
        run: bash scripts/lifecycle-check.sh "$RUNNER_TEMP/quest"

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sed "s/@TAG@/$TAG/" scripts/installer.sh > release/quest-installer.sh
          cd release
          sha256sum quest-*.tar.gz quest-installer.sh > SHA256SUMS
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}" \
            quest-*.tar.gz quest-installer.sh SHA256SUMS

  install-check:
    needs: publish
    uses: ./.github/workflows/install-check.yml
    with:
      tag: ${{ github.ref_name }}
