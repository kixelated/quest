name: Land

# `quest land` batches the PRs queued with `quest merge --land`: it squashes them
# onto main, checks the chain once, and fast-forwards main to the passing prefix.
on:
  pull_request_target:
    types: [auto_merge_enabled]
  workflow_dispatch:

# One run at a time; waiting triggers collapse into one run that reads the whole queue.
concurrency:
  group: land

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, pull-requests: read, checks: read, statuses: read }
    outputs:
      plan: ${{ steps.resolve.outputs.plan }}
    steps:
      # Every job checks out main, so quest comes from a source no queued PR can modify.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          determinate: false
      - name: Build quest
        run: |
          nix build --out-link "$RUNNER_TEMP/quest" .#quest
          echo "$RUNNER_TEMP/quest/bin" >> "$GITHUB_PATH"
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "plan=$(quest land resolve)" >> "$GITHUB_OUTPUT"

  check:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This job runs the queued PRs' code, so it holds only a read token.
    permissions: { contents: read }
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          determinate: false
      # Built outside the checkout before the chain replaces it.
      - name: Build quest
        run: |
          nix build --out-link "$RUNNER_TEMP/quest" .#quest
          echo "$RUNNER_TEMP/quest/bin" >> "$GITHUB_PATH"
      # `quest worktree run` owns processes through a systemd user scope, which the tests exercise.
      - name: Start a systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - id: check
        env:
          PLAN: ${{ needs.resolve.outputs.plan }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          echo "result=$(quest land check "$RUNNER_TEMP/plan.json" -- nix develop --command bash -c 'just install && just check && just test')" >> "$GITHUB_OUTPUT"

  land:
    needs: [resolve, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # moq-bot, which main's ruleset lets bypass it, pushes the landing. No
    # repository holds its key: token.moq.dev trades this job's GitHub ID token
    # for a moq-bot token scoped to this repository, and only for land.yml on
    # main. So this job must never run a queued PR's code, and no other job may
    # request an ID token.
    # contents: write lets github.token disable auto-merge when it ejects a PR.
    permissions:
      { contents: write, pull-requests: write, issues: write, actions: write, checks: read, statuses: read, id-token: write }
    steps:
      - id: app
        # bash runs with pipefail, so a refused request fails here rather than as an empty token.
        shell: bash
        run: |
          id=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=token.moq.dev" | jq -er .value)
          token=$(curl -fsS -X POST -H "Authorization: Bearer $id" https://token.moq.dev/land | jq -er .token)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          determinate: false
      - name: Build quest
        run: |
          nix build --out-link "$RUNNER_TEMP/quest" .#quest
          echo "$RUNNER_TEMP/quest/bin" >> "$GITHUB_PATH"
      - env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.resolve.outputs.plan }}
          RESULT: ${{ needs.check.outputs.result }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          printf '%s' "$RESULT" > "$RUNNER_TEMP/result.json"
          quest land push "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/landing"
          cat "$RUNNER_TEMP/landing"
          # The queue changed, so run again for the rest.
          if [ -s "$RUNNER_TEMP/landing" ]; then gh workflow run land.yml --ref "$GITHUB_REF_NAME"; fi
