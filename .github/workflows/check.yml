name: Check

on:
  push:
    branches: [main]
  # Drafts are claims with local checks; CI starts once a PR is ready for review.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          determinate: false
      # A PR from a quest's branch must delete or rewrite its quest. A quest
      # built from the base checks that before any of the head's code runs on
      # this runner, so the head cannot weaken the check it is held to.
      - name: Check out the base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Build quest from the base
        if: github.event_name == 'pull_request'
        run: nix build --out-link "$RUNNER_TEMP/quest-base" .#quest
      # The full history holds the merge base with the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The checkout is detached, so name the head branch.
      - name: Check that the PR leaves its quest accurate
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: ./quest-base/bin/quest --root "$GITHUB_WORKSPACE" check --base "origin/$BASE_REF" --branch "$HEAD_REF"
      - name: Install dependencies
        run: nix develop --command just install
      # `quest worktree run` owns processes through a systemd user scope, which the tests exercise.
      - name: Start a systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: Check
        run: nix develop --command just check
      - name: Test
        run: nix develop --command just test
      - name: Check Nix package
        run: nix flake check

  lifecycle:
    name: lifecycle (${{ matrix.runner }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      # Hosted macOS runners can queue past the timeout, which then reports a job
      # that never ran as failed. Pull requests rely on Release's native macOS
      # lifecycle checks instead; main still checks the flake's macOS build.
      matrix:
        runner: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-14"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          determinate: false
      - name: Install the checkout with the flake's source build
        run: nix build --out-link "$RUNNER_TEMP/quest-lifecycle-install" .#quest
      - name: Verify the installed CLI lifecycle
        shell: bash
        run: nix develop --command bash scripts/lifecycle-check.sh "$RUNNER_TEMP/quest-lifecycle-install/bin/quest"

  windows:
    name: native Windows (${{ matrix.runner }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nix doesn't run here; package.json's packageManager pins the flake's Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check CLI and core
        run: bun run check
      - name: Run the core and CLI suite
        run: bun run test
      - run: bun run build
      - name: Verify native setup and removal without symlinks
        run: bun scripts/lifecycle-check.mjs dist/quest.js
