[package]
name = "quest"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Luke Curley"]
license = "MIT OR Apache-2.0"
publish = false
description = "Versioned Markdown quests: validate plans, find ready work, and name the branches a quest lands on."
repository = "https://github.com/kixelated/quest"
readme = "README.md"

[package.metadata.dist]
dist = true

# A workspace of its own, so a checkout vendored inside another Cargo workspace
# (a submodule, say) still builds with `--manifest-path`.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
pulldown-cmark = { version = "0.13", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
