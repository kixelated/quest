[package]
name = "quest"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Luke Curley"]
license = "MIT OR Apache-2.0"
publish = false
description = "Versioned Markdown quests: validate plans, find ready work, and name the branches a quest lands on."
repository = "https://github.com/kixelated/quest"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"
